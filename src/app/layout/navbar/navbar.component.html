<nav class="navbar" [class.scrolled]="scrolled">
  <div class="container nav-inner">
    <!-- <a routerLink="/" class="logo">EK.</a> -->
    @if(theme.isDark) {
        <img routerLink="/" class="logo" src="logo-dark.svg" alt="">
    } @else {
        <img routerLink="/" class="logo" src="logo-light.svg" alt="">
    }

    <ul class="nav-links" [class.open]="menuOpen">
      <li>
        <a
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeMenu()"
          >Home</a
        >
      </li>
      <li>
        <a
          routerLink="/projects"
          routerLinkActive="active"
          (click)="closeMenu()"
          >Projects</a
        >
      </li>
      <li>
        <a
          routerLink="/services"
          routerLinkActive="active"
          (click)="closeMenu()"
          >Services</a
        >
      </li>
      <li>
        <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()"
          >About</a
        >
      </li>
      <!-- <li>
        <a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()"
          >Contact</a
        >
      </li> -->
    </ul>

    <div class="nav-right">
      <!-- Theme toggle -->
      <button
        class="theme-toggle"
        (click)="theme.toggle()"
        [attr.aria-label]="
          theme.isDark ? 'Switch to light mode' : 'Switch to dark mode'
        "
        title="Toggle theme"
      >
        @if (theme.isDark) {
          <!-- Sun -->
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </svg>
        } @else {
          <!-- Moon -->
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        }
      </button>

      <a routerLink="/contact" class="btn btn-primary cta-btn">Let's Talk</a>

      <button
        class="menu-toggle"
        (click)="menuOpen = !menuOpen"
        [attr.aria-expanded]="menuOpen"
        [class.open]="menuOpen"
        aria-label="Toggle navigation"
      >
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</nav>

<!-- Mobile overlay -->
@if (menuOpen) {
  <div class="nav-overlay" (click)="closeMenu()"></div>
}
