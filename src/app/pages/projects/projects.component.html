<section class="page-hero">

    <p class="section-label">Portfolio</p>
    <h1>All Projects</h1>
    <p class="hero-sub">
      A collection of work I've built — from design systems to full-stack
      applications.

<section class="projects-section">

      }
    </div>
  </div>
</section>
